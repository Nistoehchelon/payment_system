[profile.release]
# Maximum optimization level for speed
opt-level = 3

# Full Link Time Optimization (LTO) across all crates
lto = "fat"

# Single codegen unit allows for more global optimizations
codegen-units = 1

# hmm... do I want this?
overflow-checks = true


[workspace]
resolver = "3"
members = ["workspace_crates/*"]


[workspace.dependencies]
payment_system_structs = { path =  "workspace_crates/payment_system_structs" }
app_executable_version = { path =  "workspace_crates/app_executable_version" }
main = { path =  "workspace_crates/main" }
tokio = { version = "1.54.1", features = ["full", "macros", "net", "rt-multi-thread", "time", "tokio-macros", "tracing"] }
server = { git = "ssh://git@github.com/Nistoehchelonmneugaphy/server_2_only.git"}
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["chrono","migrate", "postgres", "macros", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
git-version = "0.3.9"
strum = { version = "0.28.0", features = ["derive"] }
anyhow = "1.0.104"
derive_more = { version = "2.1.1", features = ["display", "from", "into"] }
chrono = { version = "0.4.45" }
tracing = "0.1.44"
cryptocurrencies_stuff = { git = "ssh://git@github.com/Nistoehchelonmneugaphy/cryptocurrencies_stuff.git" }
tokio-util = { version = "0.7.20"}
